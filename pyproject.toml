[project]
name = "skill-lifecycle-manager"
version = "5.0.0"
description = "Python 3.12 Linux-native Skill lifecycle and governance CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["jsonschema>=4.25,<5"]

[project.scripts]
skill = "skill_lifecycle.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_lifecycle"]
