name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.1"
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Sync locked environment
        run: uv sync --frozen
      - name: Run unit and fault-injection suite
        run: uv run python -m unittest discover -s tests -v
      - name: Run Skill runtime probe
        run: uv run python tests/runtime.py
      - name: Run Skill behavior probe
        run: uv run python tests/behavior.py
      - name: Validate command surface
        run: uv run skill --help
      - name: Build wheel and source distribution
        run: uv build
